# ============================================================================
# Transfer Large File - v4.19.0 (Node.js 24 Native)
# ============================================================================
# CHANGES FROM v4.18.1:
#   - Updated actions/checkout@v4 → v5 (Node 24 native)
#   - Updated actions/cache@v4 → v5 (Node 24 native)
#   - actions/setup-node@v4 (auto-upgraded to Node 24 runtime)
#   - REMOVED conflicting env vars:
#       * FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
#       * ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION
#   - No more deprecation warnings!
#
# REQUIREMENTS:
#   - GitHub Actions Runner v2.327.1 or later
# ============================================================================

name: Transfer Large File

on:
  repository_dispatch:
    types: [forward_file]

concurrency:
  group: transfer-${{ github.event.client_payload.TRANSFER_ID || github.run_id }}
  cancel-in-progress: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    # NOTE: No global env needed anymore!
    # All actions below are Node 24 native.

    steps:
      # ====================================================================
      # Step 1: Checkout (v5 = Node 24 native)
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ====================================================================
      # Step 2: Setup Node.js 24 (v4 auto-upgraded to Node 24)
      # ====================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ====================================================================
      # Step 3: Cache node_modules (v5 = Node 24 native)
      # ====================================================================
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('**/pnpm-lock.yaml') }}

      # ====================================================================
      # Step 4: Cache FFmpeg (v5 = Node 24 native)
      # ====================================================================
      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/ffmpeg
          key: ${{ runner.os }}-ffmpeg-v1

      # ====================================================================
      # Step 5: Install dependencies (if cache miss)
      # ====================================================================
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          corepack enable
          pnpm config set verify-deps-before-run false
          pnpm install --prod --no-frozen-lockfile --ignore-scripts

      # ====================================================================
      # Step 6: Download FFmpeg (if cache miss)
      # ====================================================================
      - name: Install FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C ~/.local/bin --wildcards '*/ffmpeg'
          chmod +x ~/.local/bin/ffmpeg

      # ====================================================================
      # Step 7: Setup environment
      # ====================================================================
      - name: Setup environment
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mkdir -p /dev/shm/temp_transfers

      # ====================================================================
      # Step 8: Run transfer script
      # ====================================================================
      - name: Execute Transfer Script
        run: node --max-old-space-size=8192 src/transfer.js
        env:
          DOWNLOAD_WORKERS: 8
          DOWNLOAD_CHUNK_SIZE: 524288
          PARALLEL_DOWNLOAD_WORKERS: 4
          NODE_ENV: production
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.CHAT_ID }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_USE_SSL: ${{ secrets.MINIO_USE_SSL }}
          MESSAGE_ID: ${{ github.event.client_payload.MESSAGE_ID }}
          PROCESS_MESSAGE_ID: ${{ github.event.client_payload.PROCESS_MESSAGE_ID }}
          FILE_NAME: ${{ github.event.client_payload.FILE_NAME }}
          FILE_SIZE: ${{ github.event.client_payload.FILE_SIZE }}
          IS_VIDEO: ${{ github.event.client_payload.IS_VIDEO }}
          SHOULD_COMPRESS: ${{ github.event.client_payload.SHOULD_COMPRESS }}
          CLOUDFLARE_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSFER_ID: ${{ github.event.client_payload.TRANSFER_ID }}
          TEMP_DIR: /dev/shm/temp_transfers

      # ====================================================================
      # Step 9: Cleanup
      # ====================================================================
      - name: Cleanup
        if: always()
        run: echo "Transfer completed at $(date)"