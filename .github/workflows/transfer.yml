# ============================================================================
# Transfer Large File - v4.21.0 (Latest FFmpeg)
# ============================================================================
# CHANGES FROM v4.20.1:
#   - Updated to latest FFmpeg (7.x from johnvansickle git builds)
#   - Added version detection and logging
#   - Updated cache key for new version
#
# FFMPEG VERSION INFO:
#   - Source: johnvansickle.com (latest git master builds)
#   - Current: ~FFmpeg 7.0+ (git master, updated daily)
#   - Official Latest Stable: 7.1.5 "Péter" (Jun 2026)
#   - NOTE: 6.1.1 is OUTDATED (you mentioned this, but 7.x is available!)
#
# WHY JOHNVANSICKLE.COM?
#   - Always provides latest git master build
#   - Static binary (no dependencies needed)
#   - Updated daily with bug fixes
#   - Faster than official releases
# ============================================================================

name: Transfer Large File

on:
  repository_dispatch:
    types: [forward_file]

concurrency:
  group: transfer-${{ github.event.client_payload.TRANSFER_ID || github.run_id }}
  cancel-in-progress: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ====================================================================
      # Step 1: Checkout
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ====================================================================
      # Step 2: Setup Node.js 24
      # ====================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ====================================================================
      # Step 3: Cache node_modules
      # ====================================================================
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .pnpm-store
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-

      # ====================================================================
      # Step 4: Cache FFmpeg (Latest 7.x Version)
      #
      # Using v2 cache key to force refresh if you had old 6.x cached
      # ====================================================================
      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/ffmpeg
          key: ${{ runner.os }}-ffmpeg-v7x-latest
          # Fallback to older cache if v7x doesn't exist yet
          restore-keys: |
            ${{ runner.os }}-ffmpeg-v7x-
            ${{ runner.os }}-ffmpeg-static-

      # ====================================================================
      # Step 5: Install dependencies (if cache miss)
      # ====================================================================
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          corepack enable
          pnpm config set verify-deps-before-run false
          pnpm install --prod --no-frozen-lockfile --ignore-scripts

      # ====================================================================
      # Step 6: Download LATEST FFmpeg (cache miss only)
      #
      # SOURCE: https://johnvansickle.com/ffmpeg/releases/
      # VERSION: Latest git master build (~FFmpeg 7.0+, updated daily)
      # SIZE: ~80MB compressed → extracts to single ffmpeg binary
      # TIME: ~3-5 seconds download on GitHub Actions
      #
      # This is NEWER than 6.1.1!
      # ====================================================================
      - name: Install Latest FFmpeg (cache miss)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          
          echo "=============================================="
          echo "Downloading LATEST FFmpeg static binary..."
          echo "Source: johnvansickle.com (git master builds)"
          echo "Expected: FFmpeg 7.x"
          echo "=============================================="
          
          # Download latest release build
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | \
            tar -xJ --strip-components=1 -C ~/.local/bin --wildcards '*/ffmpeg'
          
          chmod +x ~/.local/bin/ffmpeg
          
          echo ""
          echo "✅ FFmpeg downloaded successfully!"
          echo "=============================================="

      # ====================================================================
      # Step 7: Setup environment + Verify FFmpeg Version
      # ====================================================================
      - name: Setup environment & Verify FFmpeg
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mkdir -p /dev/shm/temp_transfers
          
          echo "=============================================="
          echo "FFmpeg Version Check:"
          echo "=============================================="
          ffmpeg -version 2>&1 | head -5
          echo "=============================================="
          echo ""
          echo "Full path: $(which ffmpeg)"
          echo "File size: $(du -h $(which ffmpeg) | cut -f1)"

      # ====================================================================
      # Step 8: Run transfer script
      # ====================================================================
      - name: Execute Transfer Script
        run: node --max-old-space-size=8192 src/transfer.js
        env:
          DOWNLOAD_WORKERS: 8
          DOWNLOAD_CHUNK_SIZE: 524288
          PARALLEL_DOWNLOAD_WORKERS: 4
          NODE_ENV: production
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.CHAT_ID }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_USE_SSL: ${{ secrets.MINIO_USE_SSL }}
          MESSAGE_ID: ${{ github.event.client_payload.MESSAGE_ID }}
          PROCESS_MESSAGE_ID: ${{ github.event.client_payload.PROCESS_MESSAGE_ID }}
          FILE_NAME: ${{ github.event.client_payload.FILE_NAME }}
          FILE_SIZE: ${{ github.event.client_payload.FILE_SIZE }}
          IS_VIDEO: ${{ github.event.client_payload.IS_VIDEO }}
          SHOULD_COMPRESS: ${{ github.event.client_payload.SHOULD_COMPRESS }}
          CLOUDFLARE_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSFER_ID: ${{ github.event.client_payload.TRANSFER_ID }}
          TEMP_DIR: /dev/shm/temp_transfers

      # ====================================================================
      # Step 9: Cleanup
      # ====================================================================
      - name: Cleanup
        if: always()
        run: echo "Transfer completed at $(date)"