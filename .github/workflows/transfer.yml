name: Transfer Large File

on:
  repository_dispatch:
    types: [forward_file]
  workflow_dispatch:
    inputs:
      message_id:
        description: 'Telegram Message ID'
        required: true
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      file_name:
        description: 'File Name'
        required: false
        default: ''
      file_size:
        description: 'File Size in bytes'
        required: false
        default: '0'
      is_video:
        description: 'Is Video File (true/false)'
        required: false
        default: 'false'
      should_compress:
        description: 'Should Compress Video (true/false)'
        required: false
        default: 'false'

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Node Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Create RAM temp directory
        run: mkdir -p /dev/shm/temp_transfers

      - name: Execute Transfer Script
        run: node src/transfer.js
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.CHAT_ID || inputs.chat_id }}

          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_USE_SSL: ${{ secrets.MINIO_USE_SSL }}

          MESSAGE_ID: ${{ github.event.client_payload.MESSAGE_ID || inputs.message_id }}
          FILE_NAME: ${{ github.event.client_payload.FILE_NAME || inputs.file_name }}
          FILE_SIZE: ${{ github.event.client_payload.FILE_SIZE || inputs.file_size }}
          IS_VIDEO: ${{ github.event.client_payload.IS_VIDEO || inputs.is_video }}
          SHOULD_COMPRESS: ${{ github.event.client_payload.SHOULD_COMPRESS || inputs.should_compress }}

          CLOUDFLARE_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          DOWNLOAD_WORKERS: 8
          TEMP_DIR: /dev/shm/temp_transfers