name: Transfer Large File

on:
  repository_dispatch:
    types: [forward_file]

concurrency:
  group: transfer-${{ github.event.client_payload.TRANSFER_ID || github.run_id }}
  cancel-in-progress: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install pnpm & Production Dependencies (On Cache Miss)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          corepack enable
          pnpm config set verify-deps-before-run false
          pnpm install --prod --no-frozen-lockfile --ignore-scripts

      - name: Cache FFmpeg static binary
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/ffmpeg
          key: ${{ runner.os }}-ffmpeg-static-v1

      - name: Download FFmpeg static binary (On Cache Miss)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C ~/.local/bin --wildcards '*/ffmpeg'
          chmod +x ~/.local/bin/ffmpeg

      - name: Export PATH & System Config
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mkdir -p /dev/shm/temp_transfers

      - name: Execute Transfer Script
        run: node --max-old-space-size=4096 src/transfer.js
        env:
          DOWNLOAD_WORKERS: 8
          DOWNLOAD_CHUNK_SIZE: 262144
          NODE_ENV: production
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.CHAT_ID }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_USE_SSL: ${{ secrets.MINIO_USE_SSL }}
          MESSAGE_ID: ${{ github.event.client_payload.MESSAGE_ID }}
          FILE_NAME: ${{ github.event.client_payload.FILE_NAME }}
          FILE_SIZE: ${{ github.event.client_payload.FILE_SIZE }}
          IS_VIDEO: ${{ github.event.client_payload.IS_VIDEO }}
          SHOULD_COMPRESS: ${{ github.event.client_payload.SHOULD_COMPRESS }}
          CLOUDFLARE_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSFER_ID: ${{ github.event.client_payload.TRANSFER_ID }}
          TEMP_DIR: /dev/shm/temp_transfers
