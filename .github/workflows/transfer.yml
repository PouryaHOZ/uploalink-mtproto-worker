# ============================================================================
# Transfer Large File - v4.22.0 (Permanent FFmpeg Cache)
# ============================================================================
# CACHING STRATEGY:
#   - FFmpeg downloads ONLY ONCE (first run ever)
#   - All subsequent runs use CACHE (6 seconds instead of 3-5s download)
#   - Cache key is STATIC (never changes unless you change it manually)
#   - No version checks needed after first successful download
#
# FFMPEG LIFECYCLE:
#   Run 1:  Download (~4s) → Cache → Use ✅
#   Run 2+: Cache HIT (~6s) → Use ✅    ← Every future run!
#   Run N:  Change cache key → Download again → New cache
#
# TO FORCE RE-DOWNLOAD (if ever needed):
#   Change "ffmpeg-permanent-v1" to "ffmpeg-permanent-v2"
# ============================================================================

name: Transfer Large File

on:
  repository_dispatch:
    types: [forward_file]

concurrency:
  group: transfer-${{ github.event.client_payload.TRANSFER_ID || github.run_id }}
  cancel-in-progress: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ====================================================================
      # Step 1: Checkout
      # ====================================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ====================================================================
      # Step 2: Setup Node.js 24
      # ====================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ====================================================================
      # Step 3: Cache node_modules
      # ====================================================================
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .pnpm-store
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-modules-

      # ====================================================================
      # Step 4: Cache FFmpeg (PERMANENT - Downloads only ONCE!)
      #
      # KEY DESIGN: "ffmpeg-permanent-v1"
      #   - Static key = NEVER changes automatically
      #   - Once cached, ALWAYS hits (unless you clear cache or change key)
      #   - First run: downloads + caches forever
      #   - All future runs: instant cache restore!
      #
      # PERFORMANCE:
      #   - Cache HIT:  ~6 seconds (decompress existing archive)
      #   - Cache MISS: ~4 seconds (download) + auto-caches for next time
      # ====================================================================
      - name: Cache FFmpeg (Permanent)
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/ffmpeg
          # ⚠️ IMPORTANT: This key is INTENTIONALLY static!
          # It will cache FFmpeg FOREVER after first download.
          # To force re-download: change "v1" to "v2"
          key: ${{ runner.os }}-ffmpeg-permanent-v1

      # ====================================================================
      # Step 5: Install dependencies (if cache miss)
      # ====================================================================
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          corepack enable
          pnpm config set verify-deps-before-run false
          pnpm install --prod --no-frozen-lockfile --ignore-scripts

      # ====================================================================
      # Step 6: Download FFmpeg (ONLY if NOT cached yet)
      #
      # This step RUNS ONLY ONCE in the entire lifetime of your repo!
      # After first successful run, FFmpeg is cached permanently.
      #
      # You'll see this log ONLY on first run (or after clearing cache):
      #   "🔄 Cache miss - Downloading FFmpeg (this happens only once!)"
      #
      # On all future runs, you'll see:
      #   "✅ Cache hit - Using cached FFmpeg (no download needed!)"
      # ====================================================================
      - name: Download FFmpeg (First Time Only)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  🔄 FFMPEG CACHE MISS                           ║"
          echo "║  Downloading latest FFmpeg binary...            ║"
          echo "║  THIS HAPPENS ONLY ONCE - will be cached!       ║"
          echo "╚══════════════════════════════════════════════════╝"
          
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | \
            tar -xJ --strip-components=1 -C ~/.local/bin --wildcards '*/ffmpeg'
          
          chmod +x ~/.local/bin/ffmpeg
          
          echo ""
          echo "✅ FFmpeg downloaded and ready!"
          echo "📦 Next run will use cache (no re-download!)"

      # ====================================================================
      # Step 7: Verify FFmpeg & Setup Environment
      # ====================================================================
      - name: Setup Environment & Verify FFmpeg
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mkdir -p /dev/shm/temp_transfers
          
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  FFMPEG STATUS                                   ║"
          echo "╠══════════════════════════════════════════════════╣"
          
          if [ "${{ steps.cache-ffmpeg.outputs.cache-hit }}" = "true" ]; then
            echo "║  ✅ Cache HIT - Using cached FFmpeg              ║"
            echo "║  ⏱️  No download time saved!                     ║"
          else
            echo "║  🔄 Cache MISS - Freshly downloaded             ║"
            echo "║  📦 Will be cached for next run                  ║"
          fi
          
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  Version Info:                                   ║"
          ffmpeg -version 2>&1 | head -3 | sed 's/^/║  /'
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  Path: $(which ffmpeg)" | sed 's/║  /║  /'
          echo "║  Size: $(du -h $(which ffmpeg) | cut -f1)" | sed 's/║  /║  /'
          echo "╚══════════════════════════════════════════════════╝"

      # ====================================================================
      # Step 8: Run transfer script
      # ====================================================================
      - name: Execute Transfer Script
        run: node --max-old-space-size=8192 src/transfer.js
        env:
          DOWNLOAD_WORKERS: 8
          DOWNLOAD_CHUNK_SIZE: 524288
          PARALLEL_DOWNLOAD_WORKERS: 4
          NODE_ENV: production
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.CHAT_ID }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PORT: ${{ secrets.MINIO_PORT }}
          MINIO_USE_SSL: ${{ secrets.MINIO_USE_SSL }}
          MESSAGE_ID: ${{ github.event.client_payload.MESSAGE_ID }}
          PROCESS_MESSAGE_ID: ${{ github.event.client_payload.PROCESS_MESSAGE_ID }}
          FILE_NAME: ${{ github.event.client_payload.FILE_NAME }}
          FILE_SIZE: ${{ github.event.client_payload.FILE_SIZE }}
          IS_VIDEO: ${{ github.event.client_payload.IS_VIDEO }}
          SHOULD_COMPRESS: ${{ github.event.client_payload.SHOULD_COMPRESS }}
          CLOUDFLARE_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSFER_ID: ${{ github.event.client_payload.TRANSFER_ID }}
          TEMP_DIR: /dev/shm/temp_transfers

      # ====================================================================
      # Step 9: Cleanup
      # ====================================================================
      - name: Cleanup
        if: always()
        run: echo "Transfer completed at $(date)"